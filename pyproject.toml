[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "tls2dseg"
dynamic = ["version", "readme"]
authors = [
    {name = "Nicholas Meyer", email = "nixton.meyer@gmail.com"},
    {name = "Another person without mail address"},
    {email = "another.different.person.that.only.has.email@example.com"},
]
maintainers = [
    {name = "Nicholas Meyer", email = "nixton.meyer@gmail.com"},
]
description = "Description of ModuleA"
requires-python = ">=3.11"
keywords = ["ONE", "TWO"]
license = {text = "Proprietary"} # To be changed once released
classifiers = [ # https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#classifiers
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",

    "Private :: Do Not Upload" # REMOVE BEFORE FLIGHT -- PyPI will always reject packages with classifiers beginning with Private ::
]

dependencies = [ # https://packaging.python.org/en/latest/specifications/dependency-specifiers/#dependency-specifiers
                # https://packaging.python.org/en/latest/specifications/version-specifiers/#id5
    "numpy ~= 1.24",
]

[tool.setuptools.dynamic]
readme = {file = ["README.md"]}

[tool.setuptools_scm]
write_to = "src/tls2dseg/_version.py"
local_scheme = "no-local-version"
version_scheme = "post-release"

[project.urls]
Homepage = "https://example.com"
Documentation = "https://readthedocs.org"
Repository = "https://github.com/gseg-ethz/PythonTemplate.git"
Issues = "https://github.com/gseg-ethz/PythonTemplate/issues"
Changelog = "https://github.com/gseg-ethz/PythonTemplate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
doc = ["sphinx"]
dev = [
    "ruff == 0.15.14",  # Lint + format (replaces black + flake8); strict pin per RESEARCH.md Pitfall 1 — ruff ships rule-changes monthly
    "mypy == 1.20.2",   # Static type checker; pinned to latest 1.20.x per GOV-04 (2.x out of scope)
    "pytest == 8.3.5",  # Test runner; 8.x line (9.x's native TOML migration deferred)
    # pre-commit intentionally NOT listed here — it's a per-machine meta-tool (`pip install pre-commit && pre-commit install`)
]

[project.scripts]
tls2dseg = "tls2dseg.cli:main"  # Phase 1 HYGN-09 mechanic (D-09); Phase 2/3 retargets to ":app" once Typer lands (D-10)

# ----------------------------------------------------------------------------
# Ruff — lint + format (single tool replacing black + flake8 + isort) per D-01
# ----------------------------------------------------------------------------
[tool.ruff]
# D-05 originally pinned line-length = 100. Raised to 120 in Phase 1 Push 2
# to accommodate research-code long expressions (numpy math, long type
# annotations, scientific docstrings). 78 of 81 E501 violations were cleared
# by this change; 3 remaining outliers were refactored or per-file-ignored.
line-length = 120
target-version = "py311"        # matches [project] requires-python = ">=3.11"
exclude = [
    # main.py removed in Phase 2 02-01-PLAN Task 1 (relocated to src/tls2dseg/pipeline/run.py).
    "resources/",               # already in .pre-commit-config.yaml workspace-wide exclude
    "scripts/",                 # standalone util, not part of package
    "src/tls2dseg/_version.py", # auto-generated by setuptools_scm
]

[tool.ruff.lint]
# D-03: enabled rule families. D-04 explicitly defers D (docstrings), ANN (annotations),
# PL (pylint), and N (naming) — revisit per-module in later phases (Phase 8 docs work; Phase 3+ for naming/typing).
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (real bugs)
    "I",    # isort (auto-fix import order)
    "UP",   # pyupgrade (modernize to py311)
    "B",    # flake8-bugbear (mutable default args etc.)
    "SIM",  # flake8-simplify (readability auto-fixes)
    "RUF",  # ruff-native (incl. RUF012 mutable class-var defaults)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Test files often import fixtures for side-effect and redefine names (parametrized fixtures).
"tests/**/*.py" = [
    "F401",  # unused import (fixtures often imported for side-effect)
    "F811",  # redefinition (overridden fixtures)
]
# __init__.py uses re-export pattern + late imports; F401/E402 silence those.
# Note: existing __init__.py has the `all = ...` typo — Phase 2 HYGN-04 fixes that.
"src/tls2dseg/__init__.py" = ["F401", "E402"]
# bboxes_iou_gpt_brew.py — ChatGPT-generated docstrings contain Unicode
# typographic characters (×, en-dash, hyphen). File also has duplicate
# `import numpy` at line 183 (the "vectorized impl" half). File is parked
# for deletion in Phase 2 HYGN-06; per-file-ignore is cheaper than
# rewriting code that's going away.
"src/tls2dseg/bboxes_iou_gpt_brew.py" = ["RUF001", "RUF002", "RUF003", "E402", "E501"]
# detections_3d.py — calls warnings.filterwarnings() and logging.setLevel()
# BEFORE the imports that emit the suppressed messages (numpy/sklearn
# FutureWarning, tokenizers log spam). The filter MUST execute before the
# importing library scans for warnings; restructuring this is not possible.
# Intentional pattern.
"src/tls2dseg/detections_3d.py" = ["E402"]
# pipeline/run.py — relocated legacy entry-point (02-01-PLAN D-01..D-04).
# Stays at lenient lint per D-04 (Phase 3 CFG-04 ratchets it when it
# rewrites chunks). E402 is intentional (same warning-filter-before-import
# pattern as detections_3d.py); SIM210/E501/RUF059 are pre-existing legacy
# patterns carried over from main.py — not fixed in Phase 2 because the file
# is scheduled for substantial rewrite in Phase 3.
"src/tls2dseg/pipeline/run.py" = ["E402", "SIM210", "E501", "RUF059"]

[tool.ruff.lint.isort]
known-first-party = ["tls2dseg"]
# pchandler and pc2img are workspace-internal but pip-installed deps — treat as third-party (NOT first-party).

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false   # don't reformat code inside docstrings (NumPy-style examples have intentional spacing)

# ----------------------------------------------------------------------------
# Mypy — static type checker (D-06 graded strictness; CI-only, never in pre-commit)
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"         # D-07; matches [project] requires-python = ">=3.11"
mypy_path = "src"               # mandatory for src-layout (RESEARCH.md Pattern 4)
namespace_packages = true
explicit_package_bases = true

# Lenient global defaults — most existing modules are partially typed.
# Per-file strictness ratchet (below) holds new Phase 1 modules to a higher bar.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false

# Phase 2 02-01-PLAN Task 1 removed main.py (relocated to src/tls2dseg/pipeline/run.py).
# No top-level mypy exclude needed now that main.py is gone — CI invokes `mypy src/tls2dseg`
# which already scopes to the package. pipeline.run inherits the lenient global default per D-04.
exclude = []

# D-06 per-module strictness ratchet. Phase 3 extends this list (config, runtime);
# Phase 4 extends further (engines). The pattern is the ratchet mechanism — new files
# land strict; older files get tightened module-by-module as they are refactored.
[[tool.mypy.overrides]]
module = ["tls2dseg.cli", "tls2dseg.diagnostics"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

# bboxes_iou_gpt_brew.py contains intentional parallel-implementation
# duplicates (e.g. quat_to_mat_batch defined at line 21 AND line 189, for
# slow-vs-vectorized comparison). The file is parked for Phase 2 HYGN-06
# deletion; ignore-errors here is cheaper than a per-line type: ignore
# annotation that we'd just delete next phase.
[[tool.mypy.overrides]]
module = ["tls2dseg.bboxes_iou_gpt_brew"]
ignore_errors = true

# ----------------------------------------------------------------------------
# Pytest — test runner config (D-15 in pyproject.toml only; no pytest.ini / setup.cfg)
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]            # canonical src-layout pattern (RESEARCH.md Pattern 5); enables `from tls2dseg import ...` without editable install
markers = [
    "tier_a: lightweight, always-on, < 5 min, no GPU (Phase 4+)",
    "tier_b_light: moderate fixtures, mocked/CPU inference (Phase 7)",
    "tier_b_heavy: real GPU / heavy deps / large fixtures (Phase 7 self-hosted)",
    "gpu: requires CUDA (Phase 4+)",
    "cpu_only: explicitly CPU-only (Phase 3)",
]
# No `addopts` in Phase 1 — `--strict-markers` deferred to Phase 4 once real tests use markers (D-18).
