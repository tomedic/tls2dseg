[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "tls2dseg"
dynamic = ["version", "readme"]
authors = [
    {name = "Nicholas Meyer", email = "nixton.meyer@gmail.com"},
    {name = "Another person without mail address"},
    {email = "another.different.person.that.only.has.email@example.com"},
]
maintainers = [
    {name = "Nicholas Meyer", email = "nixton.meyer@gmail.com"},
]
description = "Description of ModuleA"
requires-python = ">=3.11"
keywords = ["ONE", "TWO"]
license = {text = "Proprietary"} # To be changed once released
classifiers = [ # https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#classifiers
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",

    "Private :: Do Not Upload" # REMOVE BEFORE FLIGHT -- PyPI will always reject packages with classifiers beginning with Private ::
]

dependencies = [ # https://packaging.python.org/en/latest/specifications/dependency-specifiers/#dependency-specifiers
                # https://packaging.python.org/en/latest/specifications/version-specifiers/#id5
    "numpy ~= 1.24",
]

[tool.setuptools.dynamic]
readme = {file = ["README.md"]}

[tool.setuptools_scm]
write_to = "src/tls2dseg/_version.py"
local_scheme = "no-local-version"
version_scheme = "post-release"

[project.urls]
Homepage = "https://example.com"
Documentation = "https://readthedocs.org"
Repository = "https://github.com/gseg-ethz/PythonTemplate.git"
Issues = "https://github.com/gseg-ethz/PythonTemplate/issues"
Changelog = "https://github.com/gseg-ethz/PythonTemplate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
doc = ["sphinx"]
dev = [
    "ruff == 0.15.14",  # Lint + format (replaces black + flake8); strict pin per RESEARCH.md Pitfall 1 — ruff ships rule-changes monthly
    "mypy == 1.20.2",   # Static type checker; pinned to latest 1.20.x per GOV-04 (2.x out of scope)
    "pytest == 8.3.5",  # Test runner; 8.x line (9.x's native TOML migration deferred)
    # pre-commit intentionally NOT listed here — it's a per-machine meta-tool (`pip install pre-commit && pre-commit install`)
]

[project.scripts]
tls2dseg = "tls2dseg.cli:main"  # Phase 1 HYGN-09 mechanic (D-09); Phase 2/3 retargets to ":app" once Typer lands (D-10)

# ----------------------------------------------------------------------------
# Ruff — lint + format (single tool replacing black + flake8 + isort) per D-01
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100               # D-05
target-version = "py311"        # matches [project] requires-python = ">=3.11"
exclude = [
    "main.py",                  # MANDATORY per RESEARCH.md Pitfall 6 — Phase 2 HYGN-01 deletes main.py; lint excludes until then
    "resources/",               # already in .pre-commit-config.yaml workspace-wide exclude
    "scripts/",                 # standalone util, not part of package
    "src/tls2dseg/_version.py", # auto-generated by setuptools_scm
]

[tool.ruff.lint]
# D-03: enabled rule families. D-04 explicitly defers D (docstrings), ANN (annotations),
# PL (pylint), and N (naming) — revisit per-module in later phases (Phase 8 docs work; Phase 3+ for naming/typing).
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (real bugs)
    "I",    # isort (auto-fix import order)
    "UP",   # pyupgrade (modernize to py311)
    "B",    # flake8-bugbear (mutable default args etc.)
    "SIM",  # flake8-simplify (readability auto-fixes)
    "RUF",  # ruff-native (incl. RUF012 mutable class-var defaults)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Test files often import fixtures for side-effect and redefine names (parametrized fixtures).
"tests/**/*.py" = [
    "F401",  # unused import (fixtures often imported for side-effect)
    "F811",  # redefinition (overridden fixtures)
]
# __init__.py uses re-export pattern + late imports; F401/E402 silence those.
# Note: existing __init__.py has the `all = ...` typo — Phase 2 HYGN-04 fixes that.
"src/tls2dseg/__init__.py" = ["F401", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["tls2dseg"]
# pchandler and pc2img are workspace-internal but pip-installed deps — treat as third-party (NOT first-party).

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false   # don't reformat code inside docstrings (NumPy-style examples have intentional spacing)