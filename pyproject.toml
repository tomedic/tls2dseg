[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tls2dseg"
dynamic = ["version"]
requires-python = ">=3.11"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

description = "Open-vocabulary 3D segmentation for terrestrial laser scan point clouds via 2D foundation models."

authors = [{name = "Tomislav Medic", email = "tmedic@ethz.ch"}, {name = "Claude Code", email = ""}]

keywords = ["point cloud", "tls", "lidar", "segmentation","instance","semantic","open-vocabulary","sam2", "remote-sensing", "laser scanning","geospatial","deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    # ---- ML / vision foundation models ----
    "torch ~= 2.7",
    "transformers ~= 5.1",
    "supervision ~= 0.25",
    "sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f",

    # ---- Image processing ----
    "opencv-python ~= 4.11",
    "Pillow ~= 10.4",
    "imageio ~= 2.37",
    "pyvips ~= 3.0",
    "matplotlib ~= 3.10",
    "pycocotools ~= 2.0",

    # ---- Scientific / clustering ----
    "scipy ~= 1.15",
    "scikit-learn ~= 1.6",
    "hdbscan ~= 0.8",
    "joblib ~= 1.4",
    "igraph ~= 0.11",
    "leidenalg ~= 0.10",
    "trimesh ~= 4.6",
    "networkx ~= 3.4",
    "numpy ~= 1.26",

    # ---- Internal (home-brew @ GSEG) deps ----
    # Use `pip install -e . --no-deps` if you have local editable installs of pchandler/pc2img.
    "pchandler @ git+https://<PLACEHOLDER_REPO_URL>/PCHandler.git@<PLACEHOLDER_REF>",
    "pc2img @ git+https://<PLACEHOLDER_REPO_URL>/pc2img.git@<PLACEHOLDER_REF>",

    # ---- Config + CLI ----
    "pydantic ~= 2.8",
    "pydantic-settings[yaml] ~= 2.14",
    "typer >= 0.13",
]

[project.urls]
Repository = "https://github.com/tomedic/tls2dseg"
Issues     = "https://github.com/tomedic/tls2dseg/issues"

[project.optional-dependencies]
dev = [
    "ruff == 0.15.14",
    "mypy == 1.20.2",
    "pytest == 8.3.5",
    "nox ~= 2026.4",
]

[project.scripts]
tls2dseg = "tls2dseg.cli:app"

[tool.hatch.metadata]
allow-direct-references = true  # for sam2/pchandler/pc2img as git+https URL deps

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
version_scheme = "post-release"
fallback_version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/tls2dseg/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tls2dseg"]

# Ship the runnable example + config YAMLs + reference docs into the wheel (under
# tls2dseg/), so pip-installed users have them. Fixture datasets (examples/data)
# are intentionally NOT shipped — too large; they live in the repo.
[tool.hatch.build.targets.wheel.force-include]
"examples/api_usage.py" = "tls2dseg/examples/api_usage.py"
"examples/configs" = "tls2dseg/examples/configs"
"docs" = "tls2dseg/docs"

[tool.hatch.build.targets.sdist]
include = ["src/tls2dseg", "tests", "README.md", "LICENSE", "pyproject.toml", "examples/api_usage.py", "examples/configs", "docs"]

# ----------------------------------------------------------------------------
# Ruff — lint + format
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "resources/",
    "scripts/",                 # standalone util, not part of package
    "src/tls2dseg/_version.py", # auto-generated by hatch-vcs
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (real bugs)
    "I",    # isort (auto-fix import order)
    "UP",   # pyupgrade (modernize to py311)
    "B",    # flake8-bugbear (mutable default args etc.)
    "SIM",  # flake8-simplify (readability auto-fixes)
    "RUF",  # ruff-native (incl. RUF012 mutable class-var defaults)
    "T20",  # flake8-print — enforces LOG-01 (no print() in package source; use
            # logging.getLogger("tls2dseg.<module>")). Re-homed 2026-06-11 from
            # the retired phase2-assertions CI job.
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Test files often import fixtures for side-effect and redefine names (parametrized fixtures).
"tests/**/*.py" = [
    "F401",  # unused import (fixtures often imported for side-effect)
    "F811",  # redefinition (overridden fixtures)
]
# __init__.py uses re-export pattern + late imports.
"src/tls2dseg/__init__.py" = ["F401", "E402"]
# Phase 3 sub-package __init__.py modules: pure re-export aggregators.
"src/tls2dseg/config/__init__.py" = ["F401"]
"src/tls2dseg/runtime/__init__.py" = ["F401"]
# cli.py uses Typer; typer.Option/Argument in default position is the
# library's REQUIRED idiom. B008 (do-not-call-in-defaults) is unavoidable.
"src/tls2dseg/cli.py" = ["B008"]
# detections_3d.py calls warnings.filterwarnings() / logging.setLevel() before the
# imports that emit the suppressed messages; the filter must execute first.
"src/tls2dseg/detections_3d.py" = ["E402"]
# stage1/stage2: np.seterr + warnings.filterwarnings must run before torch/pchandler
# imports that emit the suppressed messages (same pattern as run.py / detections_3d.py).
"src/tls2dseg/pipeline/stage1.py" = ["E402"]
"src/tls2dseg/pipeline/stage2.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["tls2dseg"]
# pchandler and pc2img are workspace-internal but pip-installed deps — treat as third-party.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false   # don't reformat code inside docstrings (NumPy-style examples have intentional spacing)

# ----------------------------------------------------------------------------
# Mypy — static type checker
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"               # mandatory for src-layout
namespace_packages = true
explicit_package_bases = true

# Lenient global defaults — most existing modules are partially typed.
# Per-file strictness ratchet (below) holds selected modules to a higher bar.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false

# No top-level mypy exclude — CI invokes `mypy src/tls2dseg` which already scopes to the package.
exclude = []

# Per-module strictness ratchet. `tls2dseg.pipeline` (no wildcard) matches only
# `pipeline/__init__.py`; pipeline.pipeline/stage1/stage2 are also held strict.
[[tool.mypy.overrides]]
module = ["tls2dseg.cli", "tls2dseg.diagnostics", "tls2dseg.types", "tls2dseg.pipeline", "tls2dseg.pipeline.pipeline", "tls2dseg.pipeline.stage1", "tls2dseg.pipeline.stage2", "tls2dseg.preprocessing.nms_combine", "tls2dseg.config.*", "tls2dseg.runtime.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true


# ----------------------------------------------------------------------------
# Pytest — test runner config
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]            # enables `from tls2dseg import ...` without editable install
markers = [
    "tier_a: lightweight, always-on, no heavy deps, no GPU",
    "tier_b_light: lightweight, requires pc2img and pchandler, mocked or CPU inference",
    "tier_b_heavy: real GPU, heavy deps, runs on real but small data (>50 MB per scan)",
    "gpu: requires CUDA",
    "cpu_only: explicitly CPU-only",
]
