[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "tls2dseg"
dynamic = ["version", "readme"]
authors = [
    {name = "Nicholas Meyer", email = "nixton.meyer@gmail.com"},
    {name = "Another person without mail address"},
    {email = "another.different.person.that.only.has.email@example.com"},
]
maintainers = [
    {name = "Nicholas Meyer", email = "nixton.meyer@gmail.com"},
]
description = "Description of ModuleA"
requires-python = ">=3.11"
keywords = ["ONE", "TWO"]
license = {text = "Proprietary"} # To be changed once released
classifiers = [ # https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#classifiers
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",

    "Private :: Do Not Upload" # REMOVE BEFORE FLIGHT -- PyPI will always reject packages with classifiers beginning with Private ::
]

dependencies = [ # https://packaging.python.org/en/latest/specifications/dependency-specifiers/#dependency-specifiers
                # https://packaging.python.org/en/latest/specifications/version-specifiers/#id5
    "numpy ~= 1.24",
]

[tool.setuptools.dynamic]
readme = {file = ["README.md"]}

[tool.setuptools_scm]
write_to = "src/tls2dseg/_version.py"
local_scheme = "no-local-version"
version_scheme = "post-release"

[project.urls]
Homepage = "https://example.com"
Documentation = "https://readthedocs.org"
Repository = "https://github.com/gseg-ethz/PythonTemplate.git"
Issues = "https://github.com/gseg-ethz/PythonTemplate/issues"
Changelog = "https://github.com/gseg-ethz/PythonTemplate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
doc = ["sphinx"]
dev = [
    "ruff == 0.15.14",  # Lint + format (replaces black + flake8); strict pin per RESEARCH.md Pitfall 1 — ruff ships rule-changes monthly
    "mypy == 1.20.2",   # Static type checker; pinned to latest 1.20.x per GOV-04 (2.x out of scope)
    "pytest == 8.3.5",  # Test runner; 8.x line (9.x's native TOML migration deferred)
    # pre-commit intentionally NOT listed here — it's a per-machine meta-tool (`pip install pre-commit && pre-commit install`)
]

[project.scripts]
tls2dseg = "tls2dseg.cli:main"  # Phase 1 HYGN-09 mechanic (D-09); Phase 2/3 retargets to ":app" once Typer lands (D-10)

# ----------------------------------------------------------------------------
# Ruff — lint + format (single tool replacing black + flake8 + isort) per D-01
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100               # D-05
target-version = "py311"        # matches [project] requires-python = ">=3.11"
exclude = [
    "main.py",                  # MANDATORY per RESEARCH.md Pitfall 6 — Phase 2 HYGN-01 deletes main.py; lint excludes until then
    "resources/",               # already in .pre-commit-config.yaml workspace-wide exclude
    "scripts/",                 # standalone util, not part of package
    "src/tls2dseg/_version.py", # auto-generated by setuptools_scm
]

[tool.ruff.lint]
# D-03: enabled rule families. D-04 explicitly defers D (docstrings), ANN (annotations),
# PL (pylint), and N (naming) — revisit per-module in later phases (Phase 8 docs work; Phase 3+ for naming/typing).
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (real bugs)
    "I",    # isort (auto-fix import order)
    "UP",   # pyupgrade (modernize to py311)
    "B",    # flake8-bugbear (mutable default args etc.)
    "SIM",  # flake8-simplify (readability auto-fixes)
    "RUF",  # ruff-native (incl. RUF012 mutable class-var defaults)
]
ignore = [
    # ─── PHASE 1 BASELINE — TEMPORARY ────────────────────────────────────
    # The Phase 1 ruff sweep auto-fixed 110 violations + reformatted 17 files.
    # 171 violations remain that ruff cannot auto-fix. These are silenced
    # here as a TRANSIENT Phase 1 baseline so the lint job can verify the
    # CI infrastructure works (criteria #2 + #4). Push 2 of the Phase 1
    # ruff cleanup will revisit each code and either (a) fix the underlying
    # violations and remove the code from this list, or (b) move it to
    # per-file-ignores / a permanent ignore with a documented reason.
    # See parking-lot.md @ 2026-05-27 for the Push 2 plan.
    #
    # Counts in parens are the violations remaining as of gh run 26499455035
    # post-auto-fix:
    "E501",   # line-too-long (81)  — long expressions; consider raising line-length to 120
    "E402",   # module-import-not-at-top (11) — late imports for circular-dep workarounds
    "E722",   # bare-except (1)     — fix inline (Push 2)
    "F403",   # import-star-used (2)         — wildcard imports
    "F405",   # may-be-undefined-from-star-import (14) — resolves with F403 fix
    "F811",   # redefined-while-unused (1)   — likely delete duplicate definition
    "F841",   # unused-variable (8)          — delete or prefix with _
    "B904",   # raise-without-from-inside-except (2) — add `from err`
    "B905",   # zip-without-explicit-strict (10)     — add strict= to each call
    "RUF001", # ambiguous-unicode-in-string (4) — × ‑ … in ChatGPT-brewed file
    "RUF002", # ambiguous-unicode-in-docstring (10) — same source
    "RUF003", # ambiguous-unicode-in-comment (13)   — en-dashes in comments
    "RUF013", # implicit-optional (1) — real type-safety issue, fix in Push 2
    "RUF046", # unnecessary-int-conversion (3)
    "RUF059", # unused-unpacked-variable (2)
    "SIM103", # needless-bool (2) — refactor return-True/False to direct return
    "SIM108", # if-else-block-instead-of-if-exp (4) — ternary preference
    "SIM118", # in-dict-keys (2) — `key in d.keys()` → `key in d`
    # ─── END TEMPORARY BLOCK — DO NOT EXTEND ─────────────────────────────
]

[tool.ruff.lint.per-file-ignores]
# Test files often import fixtures for side-effect and redefine names (parametrized fixtures).
"tests/**/*.py" = [
    "F401",  # unused import (fixtures often imported for side-effect)
    "F811",  # redefinition (overridden fixtures)
]
# __init__.py uses re-export pattern + late imports; F401/E402 silence those.
# Note: existing __init__.py has the `all = ...` typo — Phase 2 HYGN-04 fixes that.
"src/tls2dseg/__init__.py" = ["F401", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["tls2dseg"]
# pchandler and pc2img are workspace-internal but pip-installed deps — treat as third-party (NOT first-party).

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false   # don't reformat code inside docstrings (NumPy-style examples have intentional spacing)

# ----------------------------------------------------------------------------
# Mypy — static type checker (D-06 graded strictness; CI-only, never in pre-commit)
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"         # D-07; matches [project] requires-python = ">=3.11"
mypy_path = "src"               # mandatory for src-layout (RESEARCH.md Pattern 4)
namespace_packages = true
explicit_package_bases = true

# Lenient global defaults — most existing modules are partially typed.
# Per-file strictness ratchet (below) holds new Phase 1 modules to a higher bar.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false

# Belt-and-suspenders per RESEARCH.md Pitfall 6 — CI invokes `mypy src/tls2dseg`
# (which already scopes around main.py), but the exclude protects developers running
# `mypy .` ad-hoc. Phase 2 HYGN-01 will delete main.py.
exclude = [
    "main.py",
]

# D-06 per-module strictness ratchet. Phase 3 extends this list (config, runtime);
# Phase 4 extends further (engines). The pattern is the ratchet mechanism — new files
# land strict; older files get tightened module-by-module as they are refactored.
[[tool.mypy.overrides]]
module = ["tls2dseg.cli", "tls2dseg.diagnostics"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

# ─── PHASE 1 BASELINE — TEMPORARY ─────────────────────────────────────────
# Plan 01-04's validation only covered cli.py + diagnostics.py; the wider
# package has 29 mypy errors across 9 legacy modules (gh run 26502287075).
# These are silenced here so CI can verify the typecheck job actually runs
# end-to-end (Phase 1 success criterion #4). Push 2 of the Phase 1 cleanup
# will lift one module at a time, fixing the underlying errors.
#
# IMPORTANT: 9 of the 29 errors are `name-defined` in grounded_sam2.py
# (check_if_img_slice_empty, return_empty_detections, post_process_gdino_results,
# run_sam2_bbox_prompt_inference_in_batches, convert_masks_to_sparse_masks,
# mask_to_rle, check_if_img_slice_complete). These may be REAL missing
# references masked by wildcard imports — Push 2 must investigate, not
# just silence. See parking-lot.md @ 2026-05-27.
[[tool.mypy.overrides]]
module = [
    "tls2dseg.bboxes_iou",            # 1 error (arg-type)
    "tls2dseg.bboxes_iou_gpt_brew",   # 1 error (no-redef — duplicate `quat_to_mat_batch`)
    "tls2dseg.detections_3d",         # 1 error (syntax: `(T1, T2)` annotation)
    "tls2dseg.graph_clustering",      # 6 errors (var-annotated, assignment, index)
    "tls2dseg.grounded_sam2",         # 11 errors (9 name-defined — INVESTIGATE)
    "tls2dseg.grounded_sam2_utils",   # 1 error (arg-type)
    "tls2dseg.pc2img_utils",          # 3 errors (valid-type, assignment)
    "tls2dseg.pc_preprocessing",      # 2 errors (valid-type, arg-type)
    "tls2dseg.utils_main",            # 1 error (syntax: `(T1, T2)` annotation)
]
ignore_errors = true
# ─── END TEMPORARY BLOCK — DO NOT EXTEND ──────────────────────────────────

# ----------------------------------------------------------------------------
# Pytest — test runner config (D-15 in pyproject.toml only; no pytest.ini / setup.cfg)
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]            # canonical src-layout pattern (RESEARCH.md Pattern 5); enables `from tls2dseg import ...` without editable install
markers = [
    "tier_a: lightweight, always-on, < 5 min, no GPU (Phase 4+)",
    "tier_b_light: moderate fixtures, mocked/CPU inference (Phase 7)",
    "tier_b_heavy: real GPU / heavy deps / large fixtures (Phase 7 self-hosted)",
    "gpu: requires CUDA (Phase 4+)",
    "cpu_only: explicitly CPU-only (Phase 3)",
]
# No `addopts` in Phase 1 — `--strict-markers` deferred to Phase 4 once real tests use markers (D-18).
