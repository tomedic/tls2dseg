[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tls2dseg"
dynamic = ["version"]
requires-python = ">=3.11"
readme = "README.md"

description = "Open-vocabulary 3D instance and semantic segmentation of terrestrial laser scan point clouds via panoramic projections and 2D foundation models."

authors = [{name = "Tomislav Medic", email = "tmedic@ethz.ch"}, {name = "Claude Code", email = ""}]

keywords = ["point-cloud", "tls", "lidar", "segmentation","instance","semantic","open-vocabulary","sam2", "remote-sensing", "laser scanning","geospatial","deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    # ---- ML / vision foundation models ----
    "torch ~= 2.7",
    "transformers ~= 5.1",
    "supervision ~= 0.25",
    "sam2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f",

    # ---- Image processing ----
    "opencv-python ~= 4.11",
    "Pillow ~= 10.4",
    "imageio ~= 2.37",
    "pyvips ~= 3.0",
    "matplotlib ~= 3.10",
    "pycocotools ~= 2.0",

    # ---- Scientific / clustering ----
    "scipy ~= 1.15",
    "scikit-learn ~= 1.6",
    "hdbscan ~= 0.8",
    "joblib ~= 1.4",
    "igraph ~= 0.11",
    "leidenalg ~= 0.10",
    "trimesh ~= 4.6",
    "networkx ~= 3.4",
    "numpy ~= 1.26",

    # ---- Workspace-internal deps ----
    # If pip's resolver tries to re-clone these git URLs even when an editable install
    # exists locally, use `pip install -e . --no-deps` and verify `python -c "import pchandler, pc2img"`.
    "pchandler @ git+ssh://git@github.com/gseg-ethz/PCHandler.git@develop/tomislav",
    "pc2img    @ git+ssh://git@github.com/gseg-ethz/pc2img.git@develop/tomislav",

    # ---- Config + CLI (Phase 3 CFG-01/05/06) ----
    # typer uses `>=` per RESEARCH.md Pitfall 8 (Typer's `~=` interpretation would block 0.14+).
    "pydantic ~= 2.8",
    "pydantic-settings[yaml] ~= 2.14",
    "typer >= 0.13",
]

[project.urls]
Repository = "https://github.com/tomedic/tls2dseg"
Issues     = "https://github.com/tomedic/tls2dseg/issues"

[project.optional-dependencies]
dev = [
    "ruff == 0.15.14",
    "mypy == 1.20.2",
    "pytest == 8.3.5",
    "nox ~= 2026.4",
]

[project.scripts]
tls2dseg = "tls2dseg.cli:app"

[tool.hatch.metadata]
allow-direct-references = true  # required to declare sam2/pchandler/pc2img as git+https / git+ssh URL deps

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
version_scheme = "post-release"

[tool.hatch.build.hooks.vcs]
version-file = "src/tls2dseg/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tls2dseg"]

[tool.hatch.build.targets.sdist]
include = ["src/tls2dseg", "tests", "README.md", "LICENSE", "pyproject.toml"]

# ----------------------------------------------------------------------------
# Ruff — lint + format
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "resources/",
    "scripts/",                 # standalone util, not part of package
    "src/tls2dseg/_version.py", # auto-generated by hatch-vcs
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (real bugs)
    "I",    # isort (auto-fix import order)
    "UP",   # pyupgrade (modernize to py311)
    "B",    # flake8-bugbear (mutable default args etc.)
    "SIM",  # flake8-simplify (readability auto-fixes)
    "RUF",  # ruff-native (incl. RUF012 mutable class-var defaults)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Test files often import fixtures for side-effect and redefine names (parametrized fixtures).
"tests/**/*.py" = [
    "F401",  # unused import (fixtures often imported for side-effect)
    "F811",  # redefinition (overridden fixtures)
]
# __init__.py uses re-export pattern + late imports.
"src/tls2dseg/__init__.py" = ["F401", "E402"]
# Phase 3 sub-package __init__.py modules: pure re-export aggregators.
"src/tls2dseg/config/__init__.py" = ["F401"]
"src/tls2dseg/runtime/__init__.py" = ["F401"]
# cli.py uses Typer; typer.Option/Argument in default position is the
# library's REQUIRED idiom. B008 (do-not-call-in-defaults) is unavoidable.
"src/tls2dseg/cli.py" = ["B008"]
# detections_3d.py calls warnings.filterwarnings() / logging.setLevel() before the
# imports that emit the suppressed messages; the filter must execute first.
"src/tls2dseg/detections_3d.py" = ["E402"]
# pipeline/run.py — relocated legacy entry-point; lenient until it gets rewritten.
# E402 mirrors the warning-filter-before-import pattern; SIM210/E501/RUF059 are
# pre-existing legacy patterns.
"src/tls2dseg/pipeline/run.py" = ["E402", "SIM210", "E501", "RUF059"]

[tool.ruff.lint.isort]
known-first-party = ["tls2dseg"]
# pchandler and pc2img are workspace-internal but pip-installed deps — treat as third-party.

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false   # don't reformat code inside docstrings (NumPy-style examples have intentional spacing)

# ----------------------------------------------------------------------------
# Mypy — static type checker
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"               # mandatory for src-layout
namespace_packages = true
explicit_package_bases = true

# Lenient global defaults — most existing modules are partially typed.
# Per-file strictness ratchet (below) holds selected modules to a higher bar.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false

# No top-level mypy exclude — CI invokes `mypy src/tls2dseg` which already scopes to the package.
exclude = []

# Per-module strictness ratchet. `tls2dseg.pipeline` (no wildcard) matches only
# `pipeline/__init__.py`; `tls2dseg.pipeline.run` is intentionally NOT in the
# strict-override list so relocated legacy code stays lenient.
[[tool.mypy.overrides]]
module = ["tls2dseg.cli", "tls2dseg.diagnostics", "tls2dseg.types", "tls2dseg.pipeline"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

# Phase 3 NEW modules per Phase 1 D-06 per-module strictness ratchet.
# `tls2dseg.config.*` + `tls2dseg.runtime.*` are greenfield in Phase 3 — ship at strict from day one.
[[tool.mypy.overrides]]
module = ["tls2dseg.config.*", "tls2dseg.runtime.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

# ----------------------------------------------------------------------------
# Pytest — test runner config
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]            # enables `from tls2dseg import ...` without editable install
markers = [
    "tier_a: lightweight, always-on, < 5 min, no GPU",
    "tier_b_light: moderate fixtures, mocked/CPU inference",
    "tier_b_heavy: real GPU / heavy deps / large fixtures",
    "gpu: requires CUDA",
    "cpu_only: explicitly CPU-only",
]
