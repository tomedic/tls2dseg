# Single-view (multi-epoch) outdoor mountain scan — tree, rock (optional: stone, boulder, cliff).
# Field-order within each block, # tags: primary → tuning → pipings → other.

mode: single-view            # tag: primary

io:
  input_path: ./examples/data/mountains_small/  # tag: primary
  output_dir: ./examples/results/         # tag: primary
  resume_from_checkpoint: true            # tag: pipings
  save_intermediate: true                 # tag: pipings
  file_format: e57                        # tag: other
  save_d2d: false                         # tag: other
  run_id_strategy: timestamp_scanset      # tag: other

prompt:
  text: "tree. rock "   # tag: primary
  sizes_m: [10.0, 10.0]    # tag: primary — one size per class token, in order; mandatory when multi_zoom.active: true

preprocessing:
  output_resolution_m: 0.5       # tag: primary — typical outdoor scan voxel size; tune per dataset
  range_limits_m: null           # tag: primary — null = no range filter
  roi_polygon_m: null            # tag: primary — null = no 2D ROI polygon
  flip_upsidedown_scans_deg: null  # tag: tuning — null = no flip rotation
  keep_confidences: false        # tag: other
  assign_random_color_per_instance: false  # tag: other

projection:
  features: [intensity, range]   # tag: primary — required, min length 1
  type: spherical                # tag: other — Phase 4 engine-abstraction discriminator
  image_width: scan_resolution   # tag: other
  scan_resolution: auto          # tag: other
  rotate_pcd: auto               # tag: other
  rasterization_method: nanconv  # tag: other

inference:
  box_threshold: 0.15                          # tag: tuning
  text_threshold: 0.15                         # tag: tuning
  large_object_removal_threshold: 0.7         # tag: tuning
  partial_detection_edge_touching_threshold: 1 # tag: tuning
  sam_box_prompt_batch_size: 32                # tag: pipings
  sam2_checkpoint: /scratch/projects/sam2/checkpoints/sam2.1_hiera_large.pt     # tag: pipings — set env var; never hardcode
  type: grounded_sam2                          # tag: other — Phase 4 engine-abstraction discriminator
  object_detection_model_id: IDEA-Research/grounding-dino-base   # tag: other
  sam2_model_config: configs/sam2.1/sam2.1_hiera_l.yaml          # tag: other
  slicing:
    enabled: true                              # tag: tuning
    slice_width_height: [200, 200]             # tag: tuning
    overlap_width_height: [150, 150]           # tag: tuning
    iou_threshold: 0.80                        # tag: tuning
    overlap_filter_strategy: nms               # tag: other
    empty_slice_removal_threshold: 0.95        # tag: other
    drop_incomplete_slices: true               # tag: other
  multi_zoom:
    active: true                               # tag: primary — true = per-class adaptive multi-zoom; false = single-zoom (default)
    footprint_band_frac: [0.075, 0.225]        # tag: tuning — target footprint as fraction of DINO short-side (800 px); 0 < p_min < p_max < 1; recommended default [0.075,0.225]
    range_percentiles: [10.0, 90.0]            # tag: tuning — robust per-scan range bounds used when preprocessing.range_limits_m is null
    cross_class_iou_threshold: 0.7             # tag: tuning — cross-class dedup IoU threshold [0, 1]
    area_filter_px: null                       # tag: tuning — null = no bbox area filter (min_px, max_px)
    ios_enabled: false                         # tag: tuning — same-class intersection-over-smaller dedup
    overview_pass: true                       # tag: tuning - running one extra inference pass on a coarse overview image of the whole RoI
    max_zoom_passes: 6                         # tag: tuning — cap on tiled zoom bands per scan

d3d_extraction:
  bounding_box_type: obb        # tag: tuning
  min_point_count: 25           # tag: tuning
  centroid_type: bbox_c         # tag: other
  preprocess: true              # tag: other

# Fusion block parsed but ignored at runtime for mode=single-view (D-A1-16 soft handling).
fusion:
  merge_inst_of_same_class_only: false       # tag: tuning
  sparse_connectivity_threshold: 1           # tag: tuning
  supporters_iou_threshold: 0.15             # tag: tuning
  remove_outliers_by_support: false           # tag: tuning
  outlier_detection_threshold: 0.01          # tag: tuning
  graph_clustering_method: hcs               # tag: tuning
  min_supporters: 1                          # tag: tuning
  leiden_resolution: 250.0                   # tag: tuning
  small_cluster_removal_threshold: 1         # tag: tuning
  type: graph_cluster                        # tag: other — Phase 4 engine-abstraction discriminator
  sparse_connectivity_method: knn            # tag: other
  outlier_detection_method: negative_binomial  # tag: other

runtime:
  device: auto                # tag: pipings
  n_workers: 12               # tag: pipings
  accept_cpu_fallback: true   # tag: pipings — CPU-03 loud-fallback contract

logging:
  level: INFO                 # tag: primary
  per_package: {}             # tag: other — empty = no per-package silencing (LOG-03 conservative default)
  log_to_file: true           # tag: other
