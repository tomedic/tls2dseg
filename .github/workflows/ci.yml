# tls2dseg/.github/workflows/ci.yml
# Phase 1 CI skeleton: ruff + mypy on every PR + every push.
# No pytest job — see Phase 3 CICD-01 for pytest in CI.
#
# NOTE: `push:` is currently unscoped (all branches) so that Phase 1's
# success criterion #4 can be verified on a feature branch without merging
# to main. The plan's D-20 decision pinned this to `branches: [main]` —
# revisit once verification is complete. See parking-lot.md entry 2026-05-27.

name: CI

on:
  pull_request:
  push:

jobs:
  lint:
    name: ruff (check + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install "ruff==0.15.14"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install mypy
        run: pip install "mypy==1.20.2"
      # `mypy -p tls2dseg` (package mode) vs `mypy src/tls2dseg` (path mode):
      # path mode + `mypy_path = "src"` causes "Source file found twice under
      # different module names". Plan 01-06 D-?? originally used path mode;
      # confirmed broken on first CI run (gh run 26499455035). Package mode
      # resolves cleanly given the src-layout + mypy_path setting.
      - name: mypy -p tls2dseg
        run: mypy -p tls2dseg
