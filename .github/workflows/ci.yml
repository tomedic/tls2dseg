# tls2dseg/.github/workflows/ci.yml

# NOTE: `push:` is currently unscoped (all branches) so that Phase 1's
# success criterion #4 can be verified on a feature branch without merging
# to main. The plan's D-20 decision pinned this to `branches: [main]` —
# revisit once verification is complete. See parking-lot.md entry 2026-05-27.

name: CI

on:
  pull_request:
  push:

jobs:
  lint:
    name: ruff (check + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install "ruff==0.15.14"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install mypy + type stubs (types-PyYAML for cli.py:219 `import yaml`)
        run: pip install "mypy==1.20.2" "types-PyYAML"
      - name: mypy -p tls2dseg (from src/)
        run: cd src && mypy -p tls2dseg

  # Hatchling build smoke. Verifies the migrated build backend
  # produces both sdist + wheel.
  build-smoke:
    name: build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: pip install build
      - name: python -m build (sdist + wheel)
        run: python -m build --sdist --wheel
      - name: Verify dist artifacts present
        run: |
          ls dist/
          test -n "$(ls dist/tls2dseg-*.whl 2>/dev/null)"
          test -n "$(ls dist/tls2dseg-*.tar.gz 2>/dev/null)"

  # Uses `pip install -e . --no-deps` per RESEARCH §"Editable-install +
  # git+ssh path-dep interaction" workaround; `pip check` deliberately NOT
  # used as a gate (false-positive with --no-deps, RESEARCH §Pitfall 10).
  # Full-resolution smoke is DIST-02 (Phase 8).
  install-smoke:
    name: editable install smoke + entry-point check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: pip install -e . --no-deps (HYGN-07 workaround for git+ssh path deps)
        run: |
          pip install -e . --no-deps
      - name: Install Typer CLI runtime deps (Phase 3 CFG-05 — entry-point smoke needs these even under --no-deps)
        run: |
          pip install "typer>=0.13" "pydantic-settings[yaml]>=2.14" "pydantic>=2.0" "rich-toolkit" numpy
      - name: Install dev extras parse-smoke (--no-deps, ruff/mypy/pytest metadata only)
        run: pip install ".[dev]" --no-deps
      - name: HYGN-07 — tls2dseg imports + has __version__
        run: python -c "import tls2dseg; print(tls2dseg.__version__); assert tls2dseg.__version__"
      - name: HYGN-09 — tls2dseg --help works (entry-point smoke)
        run: tls2dseg --help
      - name: HYGN-10 — from tls2dseg import types
        run: python -c "from tls2dseg import types; assert set(types.__all__) == {'ClassMetadata', 'Detections2D', 'Detections3D', 'FusionInput', 'FusionResult', 'InferenceRequest', 'ProjectionResult'}"
      - name: pipeline subpackage importable
        run: python -c "from tls2dseg import pipeline; assert pipeline.__all__ == []"

  # Phase 3 Wave 4 (Plan 03-07) — CICD-01: Tier A pytest in cloud CI on every PR.
  # Python 3.11 only per D-A4-05 (3.12 deferred). Flags MUST match
  # `tls2dseg/noxfile.py` tier_a session EXACTLY per D-A4-01 single-source-of-
  # truth — if `pytest -m tier_a -v` changes here, also update noxfile.py.
  # Installs with --no-deps so pchandler / pc2img / RAPIDS aren't pulled into
  # the runner (Tier A is the always-on, lightweight gate).
  tier_a:
    name: tier_a pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tls2dseg (no-deps) + test deps
        run: |
          pip install -e . --no-deps
          pip install "pydantic-settings[yaml]>=2.14" "typer>=0.13" pytest numpy scipy
      - name: pytest -m tier_a
        run: python -m pytest -m tier_a -v

  # Verifies the now-public workspace dependency install path resolves + imports
  # in a clean env, WITHOUT pulling tls2dseg's heavy stack (torch/sam2/pyvips).
  workspace-deps-smoke:
    name: workspace deps install + import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install open3d runtime system libs
        run: sudo apt-get update && sudo apt-get install -y libgl1 libgomp1
      - name: pip install pchandler + pc2img from git
        run: pip install "pchandler @ git+https://github.com/gseg-ethz/PCHandler.git@develop/tomislav" "pc2img @ git+https://github.com/gseg-ethz/pc2img.git@develop/tomislav"
      - name: import smoke
        run: python -c "import pchandler, pc2img"
