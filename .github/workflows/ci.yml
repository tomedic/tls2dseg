# tls2dseg/.github/workflows/ci.yml
# Phase 1 CI skeleton: ruff + mypy on every PR + main push.
# No pytest job — see Phase 3 CICD-01 for pytest in CI.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: ruff (check + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install "ruff==0.15.14"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install mypy
        run: pip install "mypy==1.20.2"
      - name: mypy src/tls2dseg
        run: mypy src/tls2dseg
